include ~/.config/theme/sway-colors.conf

# Logo key. Use Mod1 for Alt.
set $mod Mod4
# Home row direction keys, like vim
set $left h
set $down j
set $up k
set $right l
set $term foot
set $menu ~/.local/bin/rofi-hub

set $monitor_left DP-3
set $monitor_right DP-1
set $ws1 1
set $ws2 2
set $ws3 3
set $ws4 4
set $ws5 5